#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WRT_CONFIG: ${{ inputs.WRT_CONFIG }}
  WRT_THEME: ${{ inputs.WRT_THEME }}
  WRT_NAME: ${{ inputs.WRT_NAME }}
  WRT_SSID: ${{ inputs.WRT_SSID }}
  WRT_WORD: ${{ inputs.WRT_WORD }}
  WRT_IP: ${{ inputs.WRT_IP }}
  WRT_PW: ${{ inputs.WRT_PW }}
  WRT_REPO: ${{ inputs.WRT_REPO }}
  WRT_BRANCH: ${{ inputs.WRT_BRANCH }}
  WRT_SOURCE: ${{ inputs.WRT_SOURCE }}
  WRT_PACKAGE: ${{ inputs.WRT_PACKAGE }}
  WRT_TEST: ${{ inputs.WRT_TEST }}

jobs:
  core:
    name: ${{ inputs.WRT_SOURCE }}
    runs-on: ubuntu-latest
    outputs:
      cache_prefix: ${{ steps.initialize-values.outputs.cache_prefix }}
      cache_key: ${{ steps.clone-code.outputs.cache_key }}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      # 关键：先释放磁盘空间，避免 mediatek filogic 全量编译时 No space left
      - name: Free Disk Space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/node /usr/share/miniconda /usr/local/cargo
          sudo docker image prune -af 2>/dev/null || true
          sudo docker system prune -af 2>/dev/null || true
          sudo apt-get clean
          echo "=== After cleanup ==="
          df -h

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 只做 update + 必需依赖安装，不再做 full-upgrade（省 2-4 分钟且无必要）
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends dos2unix libfuse-dev rsync zstd
          sudo bash -c 'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo systemctl daemon-reload
          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          ln -sfn /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"

          df -h /mnt/build_wrt

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[\w]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_WIFI=wifi-yes"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> "$GITHUB_ENV"
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_ENV"
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          if [ ! -d "defconfig" ]; then
            echo "defconfig directory not found, stopping workflow."
            exit 0
          fi

          # 移除国内下载源（注意转义 . ）
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/\.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          # 排除 .git，避免修改 git 内部文件
          find ./ -maxdepth 3 -type f \
            -not -path "./.git/*" \
            -iregex ".*\(txt\|sh\)$" \
            -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@v4
        with:
          key: ${{ env.WRT_CACHE_KEY }}
          restore-keys: |
            ${{ env.WRT_CACHE_PREFIX }}-
          path: |
            ./wrt/.ccache
            ./wrt/dl
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*
            ./wrt/staging_dir/target-*

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{ steps.cache-restore.outputs.cache-matched-key }}"

      - name: Update Feeds
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/
          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/
          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" >> .config
          else
            cat "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" "$GITHUB_WORKSPACE/Config/GENERAL.txt" >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc)
          make clean -j$(nproc)

      - name: Download Packages
        # 缓存命中 dl/ 时可跳过下载
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-hit != 'true' }}
        run: |
          cd ./wrt/
          make download -j$(nproc)

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        env:
          # 打包临时文件放到构建盘，避免占满 /tmp
          TMPDIR: /mnt/build_wrt/tmp
        run: |
          mkdir -p "$TMPDIR"
          cd ./wrt/

          # 编译前空间检查，低于 15G 给出警告
          AVAIL=$(df --output=avail -BG /mnt/build_wrt | tail -1 | tr -dc '0-9')
          echo "Available space: ${AVAIL}G"
          if [ "${AVAIL:-0}" -lt 15 ]; then
            echo "::warning::Low disk space (${AVAIL}G), build may fail"
          fi

          # 失败时回落到单线程详细输出，避免重复做已完成的工作
          if ! make -j$(nproc); then
            echo "::warning::Parallel build failed, retrying with verbose single-thread..."
            make -j1 V=s
          fi

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: ${{ env.WRT_CACHE_KEY }}
          path: |
            ./wrt/.ccache
            ./wrt/dl
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*
            ./wrt/staging_dir/target-*

      - name: Machine Information
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          echo "======================="
          lscpu | grep -E "name|Core|Thread" || true
          echo "======================="
          df -h
          echo "======================="
          du -sh ./bin/targets/ 2>/dev/null || true
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \; | head -n1)" >> "$GITHUB_ENV"
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> "$GITHUB_ENV"

            # 删除中间产物
            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\|manifest\)$" -exec rm -rf {} + 2>/dev/null || true

            # 只上传最终镜像（sysupgrade / factory / initramfs / kernel.bin）
            shopt -s nullglob
            for FILE in ./bin/targets/*/*/*; do
              [ -f "$FILE" ] || continue
              BASENAME=$(basename "$FILE")

              case "$BASENAME" in
                *sysupgrade*|*factory*|*initramfs*|*kernel.bin) ;;
                *) continue ;;
              esac

              EXT="${BASENAME##*.}"
              NAME="${BASENAME%.*}"
              NEW_FILE="${NAME}-${WRT_INFO}-${WRT_BRANCH}-${WRT_WIFI}-${WRT_DATE}.${EXT}"
              mv -f "$FILE" "./upload/$NEW_FILE"
            done

            # 其余文件也一并带上
            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \; 2>/dev/null || true
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}-${{ env.WRT_BRANCH }}-${{ env.WRT_DATE }}
          name: ${{ env.WRT_CONFIG }} - ${{ env.WRT_INFO }} - ${{ env.WRT_DATE }}
          files: ./wrt/upload/*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带闭源硬件加速，别问了！

            源码：${{ env.WRT_REPO }}
            分支：${{ env.WRT_BRANCH }}
            提交：${{ env.WRT_HASH }}

            配置：${{ env.WRT_CONFIG }}
            平台：${{ env.WRT_TARGET }}

            登录地址：${{ env.WRT_IP }}
            登录密码：${{ env.WRT_PW }}

            WIFI名称：${{ env.WRT_SSID }}
            WIFI密码：${{ env.WRT_WORD }}

            内核版本：${{ env.WRT_KVER }}
            插件列表：${{ env.WRT_LIST }}

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{ github.ref }}-${{ needs.core.outputs.cache_prefix }}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      WRT_CACHE_PREFIX: ${{ needs.core.outputs.cache_prefix }}
      WRT_CACHE_KEY: ${{ needs.core.outputs.cache_key }}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          # 一次调用拿到所有同前缀的 key
          KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" \
                 --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')

          if ! grep -qx "$WRT_CACHE_KEY" <<< "$KEYS"; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          # 删除同前缀但非当前的所有缓存
          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" \
            --ref "$GITHUB_REF" --limit 100 --json id,key \
            --jq '.[] | select(.key != "'"$WRT_CACHE_KEY"'") | .id' |
            while read -r CACHE_ID; do
              [ -n "$CACHE_ID" ] || continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID"
            done
